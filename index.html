<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrawOverLMS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div id="app-title">DrawOverLMS <span id="version">v1.4</span></div>
    </div>

    <div id="main-body">
      <div id="sidebar">
        <button id="btn-add-video">+ Add Video</button>
        <input type="file" id="file-input" accept="video/mp4,video/webm" multiple hidden>
        <div id="playlist"></div>
      </div>
      <div id="sidebar-resizer"></div>

      <div id="content">
        <div id="tool-row">
          <div class="tool-group">
            <button class="tool-btn active" data-tool="pen" title="Pen">🖌️</button>
            <button class="tool-btn" data-tool="laser" title="Laser">💫</button>
            <button class="tool-btn" data-tool="eraser" title="Eraser">🧹</button>
          </div>
          <div class="tool-sep"></div>
          <div class="tool-group" id="color-swatches">
            <button class="swatch active" data-color="#ff3333" style="background:#ff3333" title="Red"></button>
            <button class="swatch" data-color="#ff8800" style="background:#ff8800" title="Orange"></button>
            <button class="swatch" data-color="#ffee00" style="background:#ffee00" title="Yellow"></button>
            <button class="swatch" data-color="#33cc33" style="background:#33cc33" title="Green"></button>
            <button class="swatch" data-color="#00cccc" style="background:#00cccc" title="Cyan"></button>
            <button class="swatch" data-color="#cc33cc" style="background:#cc33cc" title="Magenta"></button>
            <button class="swatch" data-color="#ffffff" style="background:#ffffff" title="White"></button>
            <input type="color" id="color-picker" value="#ff3333" title="Custom color">
          </div>
          <div class="tool-sep"></div>
          <div class="tool-group sliders">
            <label>Size <input type="range" id="brush-size" min="1" max="40" step="1" value="4"><span id="brush-size-val">4</span></label>
            <label>Opacity <input type="range" id="brush-opacity" min="1" max="100" value="100"><span id="brush-opacity-val">100</span>%</label>
          </div>
          <div class="tool-sep"></div>
          <div class="tool-group">
            <label class="tool-label">FPS <input type="number" id="fps-input" min="1" max="120" value="24"></label>
          </div>
        </div>

        <div id="video-container">
          <canvas id="main-canvas"></canvas>
          <canvas id="pen-canvas"></canvas>
          <canvas id="laser-canvas"></canvas>
        </div>

        <div id="scrub-bar-container">
          <div id="scrub-times-top">
            <span id="scrub-current">0:00.000</span>
            <span id="scrub-frame">F: 0</span>
            <span id="scrub-total">0:00.000</span>
          </div>
          <div id="scrub-bar">
            <div id="scrub-progress"></div>
            <div id="scrub-inout"></div>
            <div id="scrub-ticks"></div>
            <div id="scrub-playhead"></div>
            <div id="scrub-in-handle" class="io-handle"></div>
            <div id="scrub-out-handle" class="io-handle"></div>
          </div>
        </div>

        <div id="playback-row">
          <button id="btn-undo" title="Undo (Ctrl+Z)">↩ Undo</button>
          <button id="btn-redo" title="Redo (Ctrl+Shift+Z)">↪ Redo</button>
          <button id="btn-toggle-drawings" class="active" title="Show/Hide Drawings">Drawings ON</button>
          <div class="pb-sep"></div>
          <button id="btn-to-start" title="Go to In / Start">|◀</button>
          <button id="btn-frame-back" title="Frame Back (←)">◄◄</button>
          <button id="btn-play" title="Play/Pause (Space)">▶</button>
          <button id="btn-frame-fwd" title="Frame Forward (→)">▶▶</button>
          <button id="btn-to-end" title="Go to Out / End">▶|</button>
          <div class="pb-sep"></div>
          <button id="btn-set-in" title="Set In Point">[ In</button>
          <button id="btn-set-out" title="Set Out Point">Out ]</button>
          <button id="btn-clear-inout" title="Clear In/Out">✕ Range</button>
          <button id="btn-loop" title="Loop In/Out">↺ Loop</button>
          <div class="pb-sep"></div>
          <button id="btn-prev-annotation" title="Previous annotated frame">◄ Draw</button>
          <button id="btn-next-annotation" title="Next annotated frame">Draw ►</button>
          <div class="pb-sep"></div>
          <button id="btn-mute" title="Mute">🔊</button>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" title="Volume">
          <button id="btn-fullscreen" title="Fullscreen">⛶</button>
        </div>

        <div id="status-bar">
          <span id="storage-info">Storage: —</span>
          <span id="status-note">Videos stored in your browser. Large files may hit quota limits.</span>
          <span id="status-version">DrawOverLMS v1.4</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // ===== DOM REFS =====
      const mainCanvas = document.getElementById('main-canvas');
      const penCanvas = document.getElementById('pen-canvas');
      const laserCanvas = document.getElementById('laser-canvas');
      const mainCtx = mainCanvas.getContext('2d');
      const penCtx = penCanvas.getContext('2d');
      const laserCtx = laserCanvas.getContext('2d');
      const videoContainer = document.getElementById('video-container');
      const scrubBar = document.getElementById('scrub-bar');
      const scrubProgress = document.getElementById('scrub-progress');
      const scrubInout = document.getElementById('scrub-inout');
      const scrubTicks = document.getElementById('scrub-ticks');
      const scrubPlayhead = document.getElementById('scrub-playhead');
      const scrubCurrent = document.getElementById('scrub-current');
      const scrubFrame = document.getElementById('scrub-frame');
      const scrubTotal = document.getElementById('scrub-total');
      const scrubInHandle = document.getElementById('scrub-in-handle');
      const scrubOutHandle = document.getElementById('scrub-out-handle');
      const playlistEl = document.getElementById('playlist');
      const fileInput = document.getElementById('file-input');
      const sidebarEl = document.getElementById('sidebar');
      const sidebarResizer = document.getElementById('sidebar-resizer');
      const btnAddVideo = document.getElementById('btn-add-video');
      const btnPlay = document.getElementById('btn-play');
      const btnFrameBack = document.getElementById('btn-frame-back');
      const btnFrameFwd = document.getElementById('btn-frame-fwd');
      const btnToStart = document.getElementById('btn-to-start');
      const btnToEnd = document.getElementById('btn-to-end');
      const btnSetIn = document.getElementById('btn-set-in');
      const btnSetOut = document.getElementById('btn-set-out');
      const btnClearInOut = document.getElementById('btn-clear-inout');
      const btnLoop = document.getElementById('btn-loop');
      const btnPrevAnnotation = document.getElementById('btn-prev-annotation');
      const btnNextAnnotation = document.getElementById('btn-next-annotation');
      const fpsInput = document.getElementById('fps-input');
      const btnMute = document.getElementById('btn-mute');
      const volumeSlider = document.getElementById('volume-slider');
      const btnUndo = document.getElementById('btn-undo');
      const btnRedo = document.getElementById('btn-redo');
      const btnToggleDrawings = document.getElementById('btn-toggle-drawings');
      const btnFullscreen = document.getElementById('btn-fullscreen');
      const brushSizeSlider = document.getElementById('brush-size');
      const brushSizeVal = document.getElementById('brush-size-val');
      const brushOpacitySlider = document.getElementById('brush-opacity');
      const brushOpacityVal = document.getElementById('brush-opacity-val');
      const colorPicker = document.getElementById('color-picker');
      const toolBtns = document.querySelectorAll('.tool-btn');
      const swatches = document.querySelectorAll('.swatch');

      // ===== STATE =====
      let playlist = [];
      let activeIndex = -1;
      let currentTool = 'pen';
      let drawColor = '#ff3333';
      let brushSize = 4;
      let brushOpacity = 1;
      let drawingsVisible = true;
      let loopEnabled = false;

      let laserStrokes = [];
      let lastLaserInputTime = 0;
      let laserFadeOpacity = 1;
      let laserFading = false;
      let laserFadeStart = 0;
      const LASER_FADE_DURATION = 500;
      const LASER_IDLE_THRESHOLD = 3000;

      let isDrawing = false;
      let currentStroke = null;
      let isErasing = false;
      let isScrubbing = false;
      let draggingHandle = null;

      // ===== HELPERS =====
      function formatTimecode(s) {
        if (isNaN(s) || !isFinite(s)) return '0:00.000';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        const ms = Math.floor((s % 1) * 1000);
        return m + ':' + String(sec).padStart(2, '0') + '.' + String(ms).padStart(3, '0');
      }

      function formatTime(s) {
        if (isNaN(s) || !isFinite(s)) return '00:00';
        return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
      }

      function getFPS() {
        const v = parseInt(fpsInput.value, 10);
        return (v >= 1 && v <= 120) ? v : 24;
      }

      function getActiveEntry() {
        return (activeIndex >= 0 && activeIndex < playlist.length) ? playlist[activeIndex] : null;
      }

      // ===== FRAME PLAYER =====
      class FramePlayer {
        constructor(canvas, ctx) {
          this.canvas = canvas;
          this.ctx = ctx;
          this.video = document.createElement('video');
          this.video.preload = 'auto';
          this.video.playsInline = true;
          this.video.style.display = 'none';
          document.body.appendChild(this.video);

          this.fps = 24;
          this.playing = false;
          this.duration = 0;
          this.inPoint = null;
          this.outPoint = null;
          this.loop = false;
          this.onFrameChange = null;
          this.onDurationChange = null;
          this._frameNum = 0;
          this._rafId = null;
          this._hasVFCB = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;

          this.video.addEventListener('seeked', () => {
            this._frameNum = Math.round(this.video.currentTime * this.fps);
            this._renderFrame();
            if (this.onFrameChange) this.onFrameChange(this._frameNum);
          });
          this.video.addEventListener('ended', () => {
            this.playing = false;
            this._cancelRAF();
            btnPlay.textContent = '▶';
            if (this.onFrameChange) this.onFrameChange(this._frameNum);
          });
        }

        get currentFrame() { return this._frameNum; }

        _frameToTime(f) { return f / this.fps + 1e-5; }

        async load(objectUrl, fps) {
          this.pause();
          this.fps = fps;
          this._frameNum = 0;
          this.video.src = objectUrl;
          return new Promise((resolve, reject) => {
            const onReady = () => {
              cleanup();
              this.duration = this.video.duration;
              this.canvas.width = this.video.videoWidth || 1280;
              this.canvas.height = this.video.videoHeight || 720;
              if (this.onDurationChange) this.onDurationChange(this.duration);
              this._renderFrame();
              if (this.onFrameChange) this.onFrameChange(0);
              resolve();
            };
            const onError = () => { cleanup(); reject(new Error('Failed to load video.')); };
            const cleanup = () => {
              this.video.removeEventListener('loadeddata', onReady);
              this.video.removeEventListener('error', onError);
            };
            this.video.addEventListener('loadeddata', onReady);
            this.video.addEventListener('error', onError);
            this.video.load();
          });
        }

        _renderFrame() {
          if (this.video.readyState < 2) return;
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
          this.ctx.drawImage(this.video, 0, 0, this.canvas.width, this.canvas.height);
        }

        _cancelRAF() {
          if (this._rafId !== null) { cancelAnimationFrame(this._rafId); this._rafId = null; }
        }

        _scheduleVFCB() {
          if (!this.playing) return;
          this.video.requestVideoFrameCallback((_, meta) => {
            if (!this.playing) return;
            this._frameNum = Math.round(meta.mediaTime * this.fps);
            this._renderFrame();
            if (this.onFrameChange) this.onFrameChange(this._frameNum);
            if (this.loop && this.inPoint !== null && this.outPoint !== null && meta.mediaTime >= this.outPoint) {
              this.video.currentTime = this.inPoint; return;
            }
            this._scheduleVFCB();
          });
        }

        _rafLoop() {
          if (!this.playing) return;
          this._frameNum = Math.round(this.video.currentTime * this.fps);
          this._renderFrame();
          if (this.onFrameChange) this.onFrameChange(this._frameNum);
          if (this.loop && this.inPoint !== null && this.outPoint !== null && this.video.currentTime >= this.outPoint) {
            this.video.currentTime = this.inPoint;
          }
          this._rafId = requestAnimationFrame(() => this._rafLoop());
        }

        play() {
          if (!this.video.src) return;
          this.playing = true;
          this.video.play().catch(() => {});
          if (this._hasVFCB) this._scheduleVFCB();
          else { this._cancelRAF(); this._rafLoop(); }
        }

        pause() {
          this.playing = false;
          this.video.pause();
          this._cancelRAF();
        }

        stepFrame(dir) {
          this.pause();
          const maxFrame = Math.ceil(this.duration * this.fps) - 1;
          const target = Math.max(0, Math.min(maxFrame, this._frameNum + dir));
          this.video.currentTime = this._frameToTime(target);
        }

        seekToTime(t) {
          this.video.currentTime = Math.max(0, Math.min(this.duration, t));
        }

        getCurrentTime() { return this.video.currentTime; }
      }

      const player = new FramePlayer(mainCanvas, mainCtx);
      player.onFrameChange = () => { redrawPenCanvas(); updateScrubBar(); updateScrubTimes(); };
      player.onDurationChange = (dur) => { scrubTotal.textContent = formatTimecode(dur); updateScrubTicks(); };

      // ===== PLAYLIST =====
      btnAddVideo.addEventListener('click', () => fileInput.click());

      function generateThumbnail(objectUrl) {
        return new Promise(resolve => {
          const vid = document.createElement('video');
          const cnv = document.createElement('canvas');
          vid.preload = 'metadata';
          vid.muted = true;
          vid.src = objectUrl;
          vid.addEventListener('loadedmetadata', () => { vid.currentTime = Math.min(1, vid.duration * 0.1); }, { once: true });
          vid.addEventListener('seeked', () => {
            cnv.width = 96; cnv.height = Math.round(96 / (vid.videoWidth / (vid.videoHeight || 1)));
            cnv.getContext('2d').drawImage(vid, 0, 0, cnv.width, cnv.height);
            vid.src = '';
            resolve(cnv.toDataURL('image/jpeg', 0.75));
          }, { once: true });
          vid.addEventListener('error', () => { vid.src = ''; resolve(null); }, { once: true });
          vid.load();
        });
      }

      fileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        const firstNewIdx = playlist.length;
        for (const file of files) {
          const objectUrl = URL.createObjectURL(file);
          const entry = { file, objectUrl, annotations: {}, inPoint: null, outPoint: null, fps: getFPS(), undoStack: [], redoStack: [], duration: 0, thumbnail: null };
          playlist.push(entry);
          await new Promise(resolve => {
            const tmp = document.createElement('video');
            tmp.preload = 'metadata'; tmp.src = objectUrl;
            tmp.onloadedmetadata = () => { entry.duration = tmp.duration || 0; resolve(); };
            tmp.onerror = resolve;
          });
          entry.thumbnail = await generateThumbnail(objectUrl);
          renderPlaylist();
        }
        fileInput.value = '';
        if (firstNewIdx < playlist.length) loadVideo(firstNewIdx);
      });

      function renderPlaylist() {
        playlistEl.innerHTML = '';
        playlist.forEach((entry, i) => {
          const row = document.createElement('div');
          row.className = 'playlist-row' + (i === activeIndex ? ' active' : '');

          const thumbEl = document.createElement(entry.thumbnail ? 'img' : 'div');
          thumbEl.className = 'playlist-thumb' + (entry.thumbnail ? '' : ' playlist-thumb-placeholder');
          if (entry.thumbnail) thumbEl.src = entry.thumbnail;
          row.appendChild(thumbEl);

          const info = document.createElement('div');
          info.className = 'playlist-info';
          const name = document.createElement('span');
          name.className = 'playlist-name';
          name.textContent = entry.file.name;
          const dur = document.createElement('span');
          dur.className = 'playlist-duration';
          dur.textContent = formatTime(entry.duration);
          info.appendChild(name); info.appendChild(dur);

          const removeBtn = document.createElement('button');
          removeBtn.className = 'playlist-remove';
          removeBtn.textContent = '✕';
          removeBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            URL.revokeObjectURL(entry.objectUrl);
            playlist.splice(i, 1);
            if (activeIndex === i) { activeIndex = -1; player.pause(); mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height); btnPlay.textContent = '▶'; }
            else if (activeIndex > i) activeIndex--;
            renderPlaylist();
          });

          row.addEventListener('click', () => loadVideo(i));
          row.appendChild(info); row.appendChild(removeBtn);
          playlistEl.appendChild(row);
        });
      }

      async function loadVideo(index) {
        if (index < 0 || index >= playlist.length) return;
        activeIndex = index;
        const entry = playlist[index];
        fpsInput.value = entry.fps;
        player.fps = entry.fps;
        player.inPoint = entry.inPoint;
        player.outPoint = entry.outPoint;
        player.loop = loopEnabled;
        btnPlay.textContent = '▶';
        try {
          await player.load(entry.objectUrl, entry.fps);
          if (player.duration) entry.duration = player.duration;
        } catch (err) { alert(err.message); return; }
        renderPlaylist();
        updateInOutUI();
        updateScrubTicks();
        resizeCanvases();
      }

      // ===== CANVAS RESIZE =====
      function resizeCanvases() {
        const rect = videoContainer.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        penCanvas.width = rect.width; penCanvas.height = rect.height;
        laserCanvas.width = rect.width; laserCanvas.height = rect.height;
        redrawPenCanvas(); redrawLaserCanvas(); updateScrubTicks();
      }
      new ResizeObserver(resizeCanvases).observe(videoContainer);

      // ===== PLAYBACK =====
      btnPlay.addEventListener('click', () => {
        if (activeIndex < 0) return;
        if (player.playing) {
          player.pause(); btnPlay.textContent = '▶';
        } else {
          if (loopEnabled) {
            const entry = playlist[activeIndex];
            if (entry.inPoint !== null && entry.outPoint !== null) {
              const t = player.getCurrentTime();
              if (t < entry.inPoint || t >= entry.outPoint) player.seekToTime(entry.inPoint);
            }
          }
          player.play(); btnPlay.textContent = '⏸';
        }
      });

      btnFrameBack.addEventListener('click', () => { if (activeIndex >= 0) player.stepFrame(-1); });
      btnFrameFwd.addEventListener('click', () => { if (activeIndex >= 0) player.stepFrame(1); });

      btnToStart.addEventListener('click', () => {
        if (activeIndex < 0) return;
        const e = playlist[activeIndex];
        player.seekToTime(e.inPoint !== null ? e.inPoint : 0);
      });

      btnToEnd.addEventListener('click', () => {
        if (activeIndex < 0) return;
        const e = playlist[activeIndex];
        player.seekToTime(e.outPoint !== null ? e.outPoint : player.duration);
      });

      function setAutoLoop() {
        const e = playlist[activeIndex];
        if (e && e.inPoint !== null && e.outPoint !== null) {
          loopEnabled = true;
          btnLoop.classList.add('active');
          player.loop = true;
        }
      }

      btnSetIn.addEventListener('click', () => {
        if (activeIndex < 0) return;
        playlist[activeIndex].inPoint = player.getCurrentTime();
        player.inPoint = playlist[activeIndex].inPoint;
        setAutoLoop();
        updateInOutUI(); updateScrubTicks();
      });

      btnSetOut.addEventListener('click', () => {
        if (activeIndex < 0) return;
        playlist[activeIndex].outPoint = player.getCurrentTime();
        player.outPoint = playlist[activeIndex].outPoint;
        setAutoLoop();
        updateInOutUI(); updateScrubTicks();
      });

      btnClearInOut.addEventListener('click', () => {
        if (activeIndex < 0) return;
        playlist[activeIndex].inPoint = null;
        playlist[activeIndex].outPoint = null;
        player.inPoint = null; player.outPoint = null;
        loopEnabled = false; btnLoop.classList.remove('active'); player.loop = false;
        updateInOutUI(); updateScrubTicks();
      });

      btnLoop.addEventListener('click', () => {
        loopEnabled = !loopEnabled;
        btnLoop.classList.toggle('active', loopEnabled);
        if (activeIndex >= 0) player.loop = loopEnabled;
      });

      fpsInput.addEventListener('change', () => {
        if (activeIndex >= 0) { playlist[activeIndex].fps = getFPS(); player.fps = getFPS(); }
      });

      btnMute.addEventListener('click', () => {
        player.video.muted = !player.video.muted;
        btnMute.textContent = player.video.muted ? '🔇' : '🔊';
      });

      volumeSlider.addEventListener('input', () => {
        player.video.volume = parseFloat(volumeSlider.value);
        player.video.muted = player.video.volume === 0;
        btnMute.textContent = player.video.muted ? '🔇' : '🔊';
      });

      // ===== ANNOTATION NAVIGATION =====
      btnPrevAnnotation.addEventListener('click', () => {
        const entry = getActiveEntry(); if (!entry) return;
        const frames = Object.keys(entry.annotations).map(Number).sort((a, b) => a - b);
        const prev = frames.filter(f => f < player.currentFrame).pop();
        if (prev !== undefined) player.stepFrame(prev - player.currentFrame);
      });

      btnNextAnnotation.addEventListener('click', () => {
        const entry = getActiveEntry(); if (!entry) return;
        const frames = Object.keys(entry.annotations).map(Number).sort((a, b) => a - b);
        const next = frames.find(f => f > player.currentFrame);
        if (next !== undefined) player.stepFrame(next - player.currentFrame);
      });

      // ===== SCRUB BAR =====
      function updateScrubBar() {
        if (!player.duration) return;
        const pct = (player.getCurrentTime() / player.duration) * 100;
        scrubProgress.style.width = pct + '%';
        scrubPlayhead.style.left = pct + '%';
      }

      function updateScrubTimes() {
        scrubCurrent.textContent = formatTimecode(player.getCurrentTime());
        scrubFrame.textContent = 'F: ' + player.currentFrame;
        if (player.duration) scrubTotal.textContent = formatTimecode(player.duration);
      }

      function scrubFromEvent(e) {
        const rect = scrubBar.getBoundingClientRect();
        const x = (e.clientX ?? (e.touches && e.touches[0].clientX)) - rect.left;
        const pct = Math.max(0, Math.min(1, x / rect.width));
        if (player.duration) player.seekToTime(pct * player.duration);
      }

      function handleDragFromEvent(e) {
        if (!draggingHandle || activeIndex < 0 || !player.duration) return;
        const rect = scrubBar.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const time = pct * player.duration;
        const key = draggingHandle === 'in' ? 'inPoint' : 'outPoint';
        playlist[activeIndex][key] = time;
        player[key] = time;
        updateInOutUI();
      }

      scrubInHandle.addEventListener('mousedown', (e) => { e.stopPropagation(); draggingHandle = 'in'; });
      scrubOutHandle.addEventListener('mousedown', (e) => { e.stopPropagation(); draggingHandle = 'out'; });

      scrubBar.addEventListener('mousedown', (e) => { if (!draggingHandle) { isScrubbing = true; scrubFromEvent(e); } });
      document.addEventListener('mousemove', (e) => {
        if (draggingHandle) handleDragFromEvent(e);
        else if (isScrubbing) scrubFromEvent(e);
      });
      document.addEventListener('mouseup', () => { isScrubbing = false; draggingHandle = null; });
      scrubBar.addEventListener('touchstart', (e) => { isScrubbing = true; scrubFromEvent(e); }, { passive: true });
      document.addEventListener('touchmove', (e) => { if (isScrubbing) scrubFromEvent(e); }, { passive: true });
      document.addEventListener('touchend', () => { isScrubbing = false; });

      function updateInOutUI() {
        const entry = getActiveEntry();
        if (!entry || !player.duration) {
          scrubInout.style.cssText = 'left:0;width:0';
          scrubInHandle.style.display = 'none';
          scrubOutHandle.style.display = 'none';
          return;
        }
        if (entry.inPoint !== null) {
          scrubInHandle.style.left = (entry.inPoint / player.duration * 100) + '%';
          scrubInHandle.style.display = '';
        } else { scrubInHandle.style.display = 'none'; }
        if (entry.outPoint !== null) {
          scrubOutHandle.style.left = (entry.outPoint / player.duration * 100) + '%';
          scrubOutHandle.style.display = '';
        } else { scrubOutHandle.style.display = 'none'; }
        if (entry.inPoint !== null && entry.outPoint !== null) {
          const lp = entry.inPoint / player.duration * 100;
          const wp = (entry.outPoint - entry.inPoint) / player.duration * 100;
          scrubInout.style.left = lp + '%'; scrubInout.style.width = wp + '%';
        } else { scrubInout.style.left = '0'; scrubInout.style.width = '0'; }
      }

      function updateScrubTicks() {
        scrubTicks.innerHTML = '';
        const entry = getActiveEntry();
        if (!entry || !player.duration) return;
        Object.keys(entry.annotations).map(Number).forEach(frame => {
          const pct = (frame / getFPS() / player.duration) * 100;
          if (pct >= 0 && pct <= 100) {
            const tick = document.createElement('div');
            tick.className = 'scrub-tick';
            tick.style.left = pct + '%';
            scrubTicks.appendChild(tick);
          }
        });
      }

      // ===== TOOLS =====
      toolBtns.forEach(btn => btn.addEventListener('click', () => {
        toolBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
        penCanvas.style.cursor = currentTool === 'eraser' ? 'cell' : 'crosshair';
      }));

      swatches.forEach(s => s.addEventListener('click', () => {
        drawColor = s.dataset.color; colorPicker.value = drawColor;
        swatches.forEach(sw => sw.classList.remove('active')); s.classList.add('active');
      }));

      colorPicker.addEventListener('input', () => { drawColor = colorPicker.value; swatches.forEach(sw => sw.classList.remove('active')); });
      brushSizeSlider.addEventListener('input', () => { brushSize = parseInt(brushSizeSlider.value, 10); brushSizeVal.textContent = brushSize; });
      brushOpacitySlider.addEventListener('input', () => { brushOpacity = parseInt(brushOpacitySlider.value, 10) / 100; brushOpacityVal.textContent = brushOpacitySlider.value; });

      // ===== DRAWING =====
      function getCanvasPos(e) {
        const rect = penCanvas.getBoundingClientRect();
        return { x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height };
      }

      function drawStrokeOnCanvas(ctx, stroke, w, h, alpha) {
        if (!stroke.points || !stroke.points.length) return;
        ctx.save();
        ctx.globalAlpha = (alpha !== undefined ? alpha : 1) * (stroke.opacity || 1);
        ctx.strokeStyle = ctx.fillStyle = stroke.color;
        ctx.lineWidth = stroke.size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        if (stroke.points.length === 1) {
          ctx.beginPath();
          ctx.arc(stroke.points[0].x * w, stroke.points[0].y * h, stroke.size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(stroke.points[0].x * w, stroke.points[0].y * h);
          for (let i = 1; i < stroke.points.length; i++) ctx.lineTo(stroke.points[i].x * w, stroke.points[i].y * h);
          ctx.stroke();
        }
        ctx.restore();
      }

      function redrawPenCanvas() {
        penCtx.clearRect(0, 0, penCanvas.width, penCanvas.height);
        const entry = getActiveEntry(); if (!entry) return;
        const strokes = entry.annotations[player.currentFrame];
        if (strokes) strokes.forEach(s => drawStrokeOnCanvas(penCtx, s, penCanvas.width, penCanvas.height));
      }

      function redrawLaserCanvas() {
        laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);
        laserStrokes.forEach(s => drawStrokeOnCanvas(laserCtx, s, laserCanvas.width, laserCanvas.height, laserFadeOpacity));
      }

      penCanvas.addEventListener('pointerdown', (e) => {
        if (!drawingsVisible || activeIndex < 0) return;
        const pos = getCanvasPos(e);
        penCanvas.setPointerCapture(e.pointerId);
        if (currentTool === 'pen') {
          if (player.playing) { player.pause(); btnPlay.textContent = '▶'; }
          isDrawing = true;
          currentStroke = { color: drawColor, size: brushSize, opacity: brushOpacity, points: [pos] };
          redrawPenCanvas();
          drawStrokeOnCanvas(penCtx, currentStroke, penCanvas.width, penCanvas.height);
        } else if (currentTool === 'laser') {
          isDrawing = true;
          laserStrokes.push({ color: drawColor, size: brushSize, opacity: brushOpacity, points: [pos] });
          lastLaserInputTime = Date.now();
          if (laserFading) { laserFading = false; laserFadeOpacity = 1; }
        } else if (currentTool === 'eraser') {
          isErasing = true; eraseAt(pos);
        }
      });

      penCanvas.addEventListener('pointermove', (e) => {
        if (!drawingsVisible) return;
        const pos = getCanvasPos(e);
        if (currentTool === 'pen' && isDrawing && currentStroke) {
          currentStroke.points.push(pos);
          redrawPenCanvas();
          drawStrokeOnCanvas(penCtx, currentStroke, penCanvas.width, penCanvas.height);
        } else if (currentTool === 'laser' && isDrawing && laserStrokes.length) {
          laserStrokes[laserStrokes.length - 1].points.push(pos);
          lastLaserInputTime = Date.now();
          if (laserFading) { laserFading = false; laserFadeOpacity = 1; }
        } else if (currentTool === 'eraser' && isErasing) {
          eraseAt(pos);
        }
      });

      const finishStroke = () => {
        if (currentTool === 'pen' && isDrawing && currentStroke) {
          isDrawing = false;
          const frame = player.currentFrame;
          const entry = playlist[activeIndex];
          if (!entry.annotations[frame]) entry.annotations[frame] = [];
          entry.annotations[frame].push(currentStroke);
          entry.undoStack.push({ type: 'add', frame, stroke: currentStroke });
          entry.redoStack = [];
          currentStroke = null;
          redrawPenCanvas(); updateScrubTicks();
        } else if (currentTool === 'laser') { isDrawing = false; }
        else if (currentTool === 'eraser') { isErasing = false; }
      };

      penCanvas.addEventListener('pointerup', finishStroke);
      penCanvas.addEventListener('pointercancel', finishStroke);

      // ===== ERASER =====
      function pointToSegDist(px, py, ax, ay, bx, by) {
        const dx = bx - ax, dy = by - ay, lenSq = dx * dx + dy * dy;
        if (!lenSq) return Math.hypot(px - ax, py - ay);
        const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lenSq));
        return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
      }

      function eraseAt(pos) {
        const entry = getActiveEntry(); if (!entry) return;
        const strokes = entry.annotations[player.currentFrame]; if (!strokes) return;
        const r = brushSize / Math.min(penCanvas.width, penCanvas.height);
        const toRemove = [];
        strokes.forEach((stroke, idx) => {
          if (!stroke.points.length) return;
          if (stroke.points.length === 1) {
            if (Math.hypot(pos.x - stroke.points[0].x, pos.y - stroke.points[0].y) <= r) toRemove.push(idx);
          } else {
            for (let i = 0; i < stroke.points.length - 1; i++) {
              if (pointToSegDist(pos.x, pos.y, stroke.points[i].x, stroke.points[i].y, stroke.points[i+1].x, stroke.points[i+1].y) <= r) {
                toRemove.push(idx); break;
              }
            }
          }
        });
        if (toRemove.length) {
          toRemove.sort((a, b) => b - a).forEach(idx => {
            const removed = strokes.splice(idx, 1)[0];
            entry.undoStack.push({ type: 'remove', frame: player.currentFrame, stroke: removed, strokeIndex: idx });
          });
          entry.redoStack = [];
          redrawPenCanvas(); updateScrubTicks();
        }
      }

      // ===== UNDO/REDO =====
      function undo() {
        const entry = getActiveEntry(); if (!entry || !entry.undoStack.length) return;
        const action = entry.undoStack.pop();
        if (action.type === 'add') {
          const removed = (entry.annotations[action.frame] || []).pop();
          entry.redoStack.push({ type: 'add', frame: action.frame, stroke: removed });
        } else {
          if (!entry.annotations[action.frame]) entry.annotations[action.frame] = [];
          entry.annotations[action.frame].push(action.stroke);
          entry.redoStack.push({ type: 'remove', frame: action.frame, stroke: action.stroke });
        }
        redrawPenCanvas(); updateScrubTicks();
      }

      function redo() {
        const entry = getActiveEntry(); if (!entry || !entry.redoStack.length) return;
        const action = entry.redoStack.pop();
        if (action.type === 'add') {
          if (!entry.annotations[action.frame]) entry.annotations[action.frame] = [];
          entry.annotations[action.frame].push(action.stroke);
          entry.undoStack.push({ type: 'add', frame: action.frame, stroke: action.stroke });
        } else {
          const removed = (entry.annotations[action.frame] || []).pop();
          entry.undoStack.push({ type: 'remove', frame: action.frame, stroke: removed });
        }
        redrawPenCanvas(); updateScrubTicks();
      }

      btnUndo.addEventListener('click', undo);
      btnRedo.addEventListener('click', redo);

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'Z' || e.key === 'z')) { e.preventDefault(); redo(); }
        else if ((e.ctrlKey || e.metaKey) && (e.key === 'Z' || e.key === 'z')) { e.preventDefault(); undo(); }
        else if (e.key === ' ') { e.preventDefault(); btnPlay.click(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); btnFrameBack.click(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); btnFrameFwd.click(); }
      });

      // ===== DRAWINGS TOGGLE & FULLSCREEN =====
      btnToggleDrawings.addEventListener('click', () => {
        drawingsVisible = !drawingsVisible;
        penCanvas.style.display = laserCanvas.style.display = drawingsVisible ? '' : 'none';
        btnToggleDrawings.textContent = drawingsVisible ? 'Drawings ON' : 'Drawings OFF';
        btnToggleDrawings.classList.toggle('active', drawingsVisible);
      });

      btnFullscreen.addEventListener('click', () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.getElementById('content').requestFullscreen().catch(() => {});
      });
      document.addEventListener('fullscreenchange', () => {
        btnFullscreen.textContent = document.fullscreenElement ? '⛶ Exit' : '⛶';
        setTimeout(resizeCanvases, 100);
      });

      // ===== LASER FADE =====
      function laserLoop() {
        const now = Date.now();
        if (laserFading) {
          laserFadeOpacity = Math.max(0, 1 - (now - laserFadeStart) / LASER_FADE_DURATION);
          if (laserFadeOpacity <= 0) { laserStrokes = []; laserFading = false; laserFadeOpacity = 1; }
        } else if (laserStrokes.length && (now - lastLaserInputTime) >= LASER_IDLE_THRESHOLD) {
          laserFading = true; laserFadeStart = now;
        }
        redrawLaserCanvas();
        requestAnimationFrame(laserLoop);
      }
      requestAnimationFrame(laserLoop);

      // ===== SIDEBAR RESIZE =====
      sidebarResizer.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        sidebarResizer.setPointerCapture(e.pointerId);
        sidebarResizer.classList.add('dragging');
      });
      sidebarResizer.addEventListener('pointermove', (e) => {
        if (!sidebarResizer.hasPointerCapture(e.pointerId)) return;
        const rect = document.getElementById('main-body').getBoundingClientRect();
        const w = Math.max(140, Math.min(480, e.clientX - rect.left));
        sidebarEl.style.width = w + 'px';
        sidebarEl.style.minWidth = w + 'px';
      });
      sidebarResizer.addEventListener('pointerup', () => {
        sidebarResizer.classList.remove('dragging');
        resizeCanvases();
      });

      // ===== STORAGE ESTIMATE =====
      if (navigator.storage && navigator.storage.estimate) {
        navigator.storage.estimate().then(({ usage, quota }) => {
          const mb = (usage / 1048576).toFixed(1);
          const gb = (quota / 1073741824).toFixed(2);
          document.getElementById('storage-info').textContent = `Storage: ${mb} MB / ${gb} GB`;
        }).catch(() => {});
      }

      // ===== INIT =====
      swatches[0].classList.add('active');
      mainCanvas.style.display = 'block';
      resizeCanvases();
    })();
  </script>
</body>
</html>
